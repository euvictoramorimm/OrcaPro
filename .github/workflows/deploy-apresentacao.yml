name: Deploy Apresentação (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apresentacao/**"
      - ".github/workflows/deploy-apresentacao.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apresentacao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apresentacao/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar slides
        run: npx slidev build slides.md --base /OrcaPro/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apresentacao/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
